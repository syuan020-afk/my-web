<title>Mr. Oops 方格版</title>
<style>
  :root {
    --bg: #1a1a1a; --paper: #f8f9fa; --ink: #222; --overlay: rgba(255,255,255,0.94);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overscroll-behavior: none; touch-action: none; }
  html.ui, html.ui body { touch-action: manipulation; }
  body { background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; position: relative; touch-action: none; }
  #fps { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 6px); left: 8px; font-size: 11px; color: rgba(255,255,255,0.7); font-family: monospace; z-index: 20; pointer-events: none; }
  #bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; pointer-events: none; }
  #ui { font-size: 28px; font-weight: bold; color: #f8f9fa; }
  #best { font-size: 18px; font-weight: bold; color: #f2c14e; }
  #hint { font-size: 13px; color: #999; margin-top: 12px; pointer-events: none; }
  canvas { background: #4f8a3a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); touch-action: none; }
  #gameover { position: absolute; display: none; flex-direction: column; align-items: center; background: var(--overlay); color: var(--ink); padding: 30px 50px; border: 3px solid var(--ink); border-radius: 12px; z-index: 3; }
  button { margin-top: 15px; padding: 10px 25px; font-size: 18px; font-weight: bold; background: var(--ink); color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  button:active { transform: scale(0.95); }
  .screen { position: fixed; inset: 0; background: #1a1a1a; color: #f8f9fa; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 10; padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px); text-align: center; }
  .screen.hidden { display: none; }
  .screen button { margin-top: 0; min-width: 200px; background: #f8f9fa; color: #222; }
  .title { font-size: 44px; letter-spacing: 1px; }
  #menu-best { color: #f2c14e; font-size: 20px; font-weight: bold; margin-bottom: 8px; }
  #home { background: #666; margin-left: 8px; }
  #pause { pointer-events: auto; display: none; align-items: center; justify-content: center; gap: 5px; width: 42px; height: 36px; margin: 0; padding: 0; background: rgba(255,255,255,0.16); border-radius: 8px; }
  #pause span { display: block; width: 5px; height: 16px; background: #f8f9fa; border-radius: 2px; }
  .vol { display: flex; align-items: center; gap: 10px; width: min(320px, 100%); font-size: 17px; }
  .vol label { width: 40px; text-align: left; }
  .vol input[type=range] { flex: 1; accent-color: #f2c14e; height: 32px; }
  .vol span { width: 40px; text-align: right; color: #f2c14e; font-size: 15px; }
</style>
</head>
<body>
  <div id="fps">-- FPS</div>
  <div id="bar"><button id="pause" aria-label="暫停"><span></span><span></span></button><div id="ui">0.00 秒</div><div id="best">最佳 --</div></div>
  <canvas id="game"></canvas>
  <div id="hint">在畫面上滑動，滑一下走一格（電腦可用方向鍵）</div>
  <div id="gameover">
    <h1 style="font-size: 36px; margin-bottom: 10px;">OOPS!</h1>
    <p id="final-score" style="font-size: 20px;"></p>
    <button id="restart">再玩一次</button>
    <button id="home">回主頁</button>
  </div>

<div id="menu" class="screen">
    <h1 class="title">Mr. Oops</h1>
    <p id="menu-best"></p>
    <button id="btn-start">開始遊戲</button>
  </div>

<div id="pausemenu" class="screen hidden">
    <h2>暫停</h2>
    <button id="btn-resume">繼續遊戲</button>
    <div class="vol"><label>音樂</label><input id="vol-music" type="range" min="0" max="100"><span id="vm"></span></div>
    <div class="vol"><label>音效</label><input id="vol-sfx" type="range" min="0" max="100"><span id="vs"></span></div>
    <button id="btn-pause-home">回到主頁</button>
  </div>

<script>
const N = 6;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const gameoverScreen = document.getElementById('gameover');
const finalScore = document.getElementById('final-score');

// 方格外多留一圈邊界，用來顯示箭頭提示
const avail = Math.min(window.innerWidth - 16, window.innerHeight - 130, 540);
const cell = Math.max(36, Math.floor(avail / (N + 1.4)));
const size = cell * N;
const pad = cell * 0.7;
canvas.width = size + 2 * pad;
canvas.height = size + 2 * pad;
document.getElementById('bar').style.width = canvas.width + 'px';

let player, hazards, particles, startTime, isGameOver, spawnTimer, shakeTime;

function init() {
  player = { c: 2, r: 2, px: 2.5 * cell, py: 2.5 * cell, walk: 0 };
  hazards = [];
  particles = [];
  startTime = Date.now();
  isGameOver = false;
  spawnTimer = 0;
  shakeTime = 0;
  gameoverScreen.style.display = 'none';
  ui.innerText = '0.00 秒';
}

// 點擊螢幕：火柴人像拍照一樣定格擺 pose（迪斯可指天、秀肌肉、金雞獨立），隨機挑一個，不會連續重複
let lastPose = -1;
function doPose() {
  let t; do { t = Math.floor(Math.random() * 3); } while (t === lastPose);
  lastPose = t;
  player.pose = { type: t, t0: performance.now(), dur: 1300 };
}

function move(dc, dr) {
  if (isGameOver || inMenu || paused) return;
  const nc = Math.max(0, Math.min(N - 1, player.c + dc));
  const nr = Math.max(0, Math.min(N - 1, player.r + dr));
  if (nc !== player.c || nr !== player.r) {
    player.c = nc; player.r = nr;
    player.walk += 2;
    player.pose = null; // 走動時取消 pose
    sfxMove();
  }
}

// 滑動操作：滑一下 = 走一格
const SWIPE_MIN = 20;
let start = null;
window.addEventListener('pointerdown', e => { start = { x: e.clientX, y: e.clientY, t: Date.now() }; });
window.addEventListener('pointermove', e => {
  if (!start) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  if (Math.hypot(dx, dy) < SWIPE_MIN) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1, 0);
  else move(0, dy > 0 ? 1 : -1);
  start = null; // 這一滑只算一格，需放開再滑
});
window.addEventListener('pointerup', e => {
  // 點一下（沒有滑動、按得很短、不是按在按鈕上）= 擺 pose
  if (start && !inMenu && !paused && !isGameOver && !(e.target.closest && e.target.closest('button')) && Date.now() - start.t < 500) doPose();
  start = null;
});
window.addEventListener('pointercancel', () => { start = null; });
window.addEventListener('keydown', e => {
  const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (k) { e.preventDefault(); move(k[0], k[1]); }
});
document.getElementById('restart').addEventListener('click', init);

// 生成陷阱：整列或整行先閃紅色警告，再射出子彈
function spawnHazard(horizontal, idx) {
  const dir = Math.random() < 0.5 ? 1 : -1;
  const t = (Date.now() - startTime) / 1000;
  const v = cell * 0.05 * dir; // 3 格/秒（以 60 幀/秒換算） // 滾動速度固定
  hazards.push({
    horizontal, idx, v,
    x: horizontal ? (dir > 0 ? -cell : size + cell) : (idx + 0.5) * cell,
    y: horizontal ? (idx + 0.5) * cell : (dir > 0 ? -cell : size + cell),
    warn: 60, r: cell * 0.4, dir, roll: 0, z: ZDROP, vz: 0, sm: 1, entered: false, landed: false, air: false,
    spots: Array.from({ length: 15 }, () => ({ phi: Math.random() * Math.PI * 2, lat: (Math.random() - 0.5) * 1.7, size: 0.08 + Math.random() * 0.16 })),
    specks: Array.from({ length: 40 }, () => ({ phi: Math.random() * Math.PI * 2, lat: (Math.random() - 0.5) * 1.8, size: 0.025 + Math.random() * 0.045, light: Math.random() < 0.45 })),
    cracks: Array.from({ length: 6 }, () => ({ phi: Math.random() * Math.PI * 2, lat: (Math.random() - 0.5) * 1.4, dphi: (Math.random() - 0.5) * 0.9, dlat: (Math.random() - 0.5) * 0.7 })),
    shape: Array.from({ length: 9 }, () => 0.9 + Math.random() * 0.16)
  });
}

// 每一波同時出現多顆石頭，時間越久數量越多（最多 5 顆）
// 每波之間的間隔（幀數）隨時間縮短：從 70 幀降到 30 幀，比一波的滾動時間短，所以方格內會同時有好幾波
const waveInterval = elapsed => Math.max(30, 70 - Math.floor(elapsed * 1.5));
function spawnWave(elapsed) {
  const count = Math.min(8, 1 + Math.floor(elapsed / 10));
  // 場上已有的石頭也算進去：不重複同一條線，橫向、直向各最多 4 條，確保永遠有安全格
  const used = new Set();
  let rows = 0, cols = 0, tries = 0, spawned = 0;
  hazards.forEach(h => {
    if (h.warn <= 0) return; // 已經射出的石頭不佔用線，下一波不用等它滾完
    const key = (h.horizontal ? 'h' : 'v') + h.idx;
    if (used.has(key)) return;
    used.add(key);
    if (h.horizontal) rows++; else cols++;
  });
  while (spawned < count && tries++ < 50) {
    const horizontal = Math.random() < 0.5;
    if (horizontal ? rows >= 4 : cols >= 4) continue; // 每種方向最多 4 條，確保永遠有安全格
    const idx = Math.floor(Math.random() * N);
    const key = (horizontal ? 'h' : 'v') + idx;
    if (used.has(key)) continue;
    used.add(key);
    if (horizontal) rows++; else cols++;
    spawnHazard(horizontal, idx);
    spawned++;
  }
}

function createExplosion(x, y) {
  for (let i = 0; i < 25; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * 8 + 2;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, size: Math.random() * 6 + 2, life: 1 });
  }
}

// 咖啡色泥土地背景（只畫一次，之後重複貼上）
const bg = document.createElement('canvas');
bg.width = canvas.width;
bg.height = canvas.height;
(function () {
  const b = bg.getContext('2d');
  b.fillStyle = '#a98259';
  b.fillRect(0, 0, bg.width, bg.height);
  for (let i = 0; i < 900; i++) {
    const x = Math.random() * bg.width, y = Math.random() * bg.height, s = Math.random() * 4 + 1;
    b.fillStyle = Math.random() < 0.5 ? 'rgba(50,28,12,0.25)' : 'rgba(190,140,90,0.18)';
    b.beginPath(); b.ellipse(x, y, s * 1.4, s, Math.random() * 3, 0, Math.PI * 2); b.fill();
  }
  for (let i = 0; i < 45; i++) {
    const x = Math.random() * bg.width, y = Math.random() * bg.height, s = Math.random() * 2.5 + 1.5;
    b.fillStyle = 'rgba(120,100,85,0.55)';
    b.beginPath(); b.arc(x, y, s, 0, Math.PI * 2); b.fill();
    b.fillStyle = 'rgba(40,25,15,0.3)';
    b.beginPath(); b.arc(x + 1, y + 1.2, s * 0.8, 0, Math.PI * 2); b.fill();
  }
})();

// 草地 + 更逼真的泥土（只畫一次）
// 最佳紀錄（存在瀏覽器裡，讀寫失敗時照樣可玩）
let best = 0;
try { best = parseFloat(localStorage.getItem('mrOopsBest')) || 0; } catch (e) {}
const bestEl = document.getElementById('best');
function showBest() { document.getElementById('menu-best').innerText = best > 0 ? '最佳紀錄：' + best.toFixed(2) + ' 秒' : '還沒有紀錄，來挑戰看看！'; bestEl.innerText = best > 0 ? '最佳 ' + best.toFixed(2) + ' 秒' : '最佳 --'; }
showBest();
// 最佳紀錄同步到帳號的私人資料庫（只有自己看得到），瀏覽器清掉資料或換裝置也不會不見
let bestRef = null;
(async () => {
  try {
    if (!window.claude) return;
    const user = await claude.use('user');
    const db = await claude.use('db');
    const id = user ? await user.id() : null;
    if (!db || !id) return;
    bestRef = db.collection('data/users/' + id).doc('best');
    const snap = await bestRef.get();
    const remote = snap.exists ? (snap.data().value || 0) : 0;
    if (remote > best) { best = remote; showBest(); }
    else if (best > remote) { await bestRef.set({ value: best }); }
  } catch (e) {}
})();
function saveBestRemote() { if (bestRef) bestRef.set({ value: best }).catch(() => {}); }
let nextWave = 60;
// ===== 低窪地形：方格內是比外圍草地低的盆地，邊緣是一道落差 =====
const RIM = cell * 0.45;       // 落差邊緣的坡面寬度（很陡）
const ZDROP = cell * 0.6;      // 落差高度（畫面上的像素）
const GRAV = cell * 0.018;     // 下墜加速度（每幀）
function terrainDepth(x, y) {  // x、y 為方格座標（0 ~ size）；方格外 = 0，盆地底部 = 1
  const a = x, b = size - x, c = y, d = size - y;
  if (a <= 0 || b <= 0 || c <= 0 || d <= 0) return 0;
  const e = Math.pow(Math.pow(a, -4) + Math.pow(b, -4) + Math.pow(c, -4) + Math.pow(d, -4), -0.25); // 圓角
  if (e >= RIM) return 1;
  const t = e / RIM;
  return t * t * (3 - 2 * t);
}
// 泥土地打光：光源在左上。坡面朝向光源較亮、背光較暗；上方與左側的邊緣會在盆地內投下陰影
function applyTerrainShading(b) {
  const x0 = Math.round(pad), y0 = Math.round(pad);
  const img = b.getImageData(x0, y0, size, size), px = img.data;
  const K2 = RIM * 0.9, SW = cell * 0.9;
  for (let j = 0; j < size; j++) {
    for (let i = 0; i < size; i++) {
      const dep = terrainDepth(i, j);
      const gx = (terrainDepth(i + 1, j) - terrainDepth(i - 1, j)) / 2;
      const gy = (terrainDepth(i, j + 1) - terrainDepth(i, j - 1)) / 2;
      const lit = -(gx + gy) * 0.5 * K2;
      const sh = Math.max(0, 1 - i / SW, 1 - j / SW);
      const f = Math.max(0.25, 1 + lit * 1.1) * (1 - 0.12 * dep) * (1 - 0.5 * sh);
      const k = (j * size + i) * 4;
      px[k] = Math.min(255, px[k] * f);
      px[k + 1] = Math.min(255, px[k + 1] * f);
      px[k + 2] = Math.min(255, px[k + 2] * f);
    }
  }
  b.putImageData(img, x0, y0);
}
// 石頭靠自己的力量往前滾：滾到邊緣時水平速度完全不變，只是高度很快地落下一小段、著地時砸出聲音與塵土，
// 然後直接繼續滾，不停頓。離開盆地時則沿著對側邊緣平順升回高地。
function updateFall(h, dt) {
  const u = h.horizontal ? h.x : h.y;
  if (!h.entered) {
    h.air = false;
    if (h.dir > 0 ? u >= 0 : u <= size) { h.entered = true; h.vz = 0; } else return;
  }
  const over = h.dir > 0 ? u - size : -u; // 越過對側邊緣的距離
  if (over > 0) { h.air = false; h.sm = 1; h.z = Math.min(ZDROP, (ZDROP * over) / (cell * 0.5)); return; }
  if (!h.landed) {
    h.air = true;
    h.vz += GRAV * dt;
    h.z -= h.vz * dt;
    if (h.z <= 0) { h.z = 0; h.landed = true; h.air = false; sfxLand(1.1); landDust(h); }
  } else {
    h.air = false;
    h.sm += (1 - h.sm) * Math.min(1, 0.2 * dt);
  }
}
function landDust(h) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * 1.6 + 0.4;
    particles.push({ x: h.x + Math.cos(a) * h.r * 0.6, y: h.y + Math.sin(a) * h.r * 0.6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.3, size: Math.random() * 7 + 4, life: 0.9, dust: true });
  }
}

const bg2 = document.createElement('canvas');
bg2.width = canvas.width;
bg2.height = canvas.height;
(function () {
  const b = bg2.getContext('2d');
  const W = bg2.width, H = bg2.height;
  const rnd = (a, c) => a + Math.random() * (c - a);
  // 方格外：綠色草地
  b.fillStyle = '#4f8a3a';
  b.fillRect(0, 0, W, H);
  for (let i = 0; i < 3500; i++) {
    const x = rnd(0, W), y = rnd(0, H);
    b.strokeStyle = Math.random() < 0.5 ? 'rgba(30,90,30,0.5)' : 'rgba(150,205,85,0.45)';
    b.lineWidth = 1.2;
    b.beginPath(); b.moveTo(x, y); b.lineTo(x + rnd(-2, 2), y - rnd(2, 8)); b.stroke();
  }
  // 方格內：泥土地
  b.save();
  b.beginPath(); b.rect(pad, pad, size, size); b.clip();
  b.drawImage(bg, 0, 0);
  for (let i = 0; i < 40; i++) {
    const x = pad + rnd(0, size), y = pad + rnd(0, size), r = cell * rnd(0.6, 1.8);
    const g = b.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, Math.random() < 0.5 ? 'rgba(40,22,10,0.28)' : 'rgba(205,155,100,0.2)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = g; b.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  for (let i = 0; i < 6000; i++) {
    b.fillStyle = Math.random() < 0.5 ? 'rgba(30,15,5,0.35)' : 'rgba(225,175,125,0.25)';
    b.fillRect(pad + rnd(0, size), pad + rnd(0, size), 1.5, 1.5);
  }
  for (let i = 0; i < 14; i++) {
    let x = pad + rnd(0, size), y = pad + rnd(0, size);
    b.strokeStyle = 'rgba(35,18,8,0.35)'; b.lineWidth = 1;
    b.beginPath(); b.moveTo(x, y);
    for (let k = 0; k < 4; k++) { x += rnd(-0.25, 0.25) * cell; y += rnd(-0.25, 0.25) * cell; b.lineTo(x, y); }
    b.stroke();
  }
  applyTerrainShading(b);
  b.restore();
  // 泥土邊緣的草叢
  for (let i = 0; i < 500; i++) {
    const t = Math.random() * 4 * size, side = Math.floor(t / size), p = t % size;
    let x, y, dx, dy;
    if (side === 0) { x = pad + p; y = pad; dx = 0; dy = -1; }
    else if (side === 1) { x = pad + size; y = pad + p; dx = 1; dy = 0; }
    else if (side === 2) { x = pad + p; y = pad + size; dx = 0; dy = 1; }
    else { x = pad; y = pad + p; dx = -1; dy = 0; }
    const L = rnd(4, 11);
    b.strokeStyle = Math.random() < 0.5 ? 'rgba(35,100,35,0.9)' : 'rgba(150,205,85,0.85)';
    b.lineWidth = 1.5;
    b.beginPath(); b.moveTo(x - dx * 2, y - dy * 2); b.lineTo(x + dx * L + rnd(-2.5, 2.5), y + dy * L + rnd(-2.5, 2.5)); b.stroke();
  }
})();

function drawGrid() {
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.setLineDash([]);
  for (let i = 0; i <= N; i++) {
    ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(size, i * cell); ctx.stroke();
  }
}

function drawStickman(p, sq = 0) {
  const s = cell / 75;
  let swing = Math.sin(p.walk) * 4 * (1 - sq);
  // pose 動作（被碾過時不播放）
  let pose = -1, pt = 0, hop = 0;
  if (p.pose && !sq) {
    pt = (performance.now() - p.pose.t0) / p.pose.dur;
    if (pt >= 1) p.pose = null; else { pose = p.pose.type; swing = 0; }
  }
  // 待機：沒在移動、沒在擺 pose 時，身體會左右快速閃躲（慢慢進入、慢慢退出，不會突然切換）
  const nowMs = performance.now();
  const idleNow = pose === -1 && !sq && !isGameOver && Math.abs(p.px - (p.c + 0.5) * cell) < 1.5 && Math.abs(p.py - (p.r + 0.5) * cell) < 1.5;
  p.idleK = (p.idleK || 0) + ((idleNow ? 1 : 0) - (p.idleK || 0)) * 0.08;
  const k = p.idleK;
  swing *= 1 - 0.6 * k;
  // 被碾過時整個身體一起壓扁：以腳底(y=18)為基準，高度縮短、寬度攤開，手腳往兩側張開
  const sx = 1 + 0.6 * sq, sy = 1 - 0.68 * sq;
  const arm = 7 + 9 * sq, leg = 5 + 8 * sq;
  const X = x => x * sx, Y = y => 18 + (y - 18) * sy;
  ctx.save();
  ctx.translate(p.px, p.py + 2 * s);
  ctx.scale(s * 1.6, s * 1.6);
  // 待機：像躲避球一樣左右快速閃躲（左、右交替，動作小而迅速，每次約 0.3 秒）
  let aL = 0, aR = 0;
  if (k > 0.01) {
    const tb = nowMs / 300, d = Math.floor(tb) % 2 === 0 ? -1 : 1;
    const e = Math.min(1, Math.sin((tb % 1) * Math.PI) * 1.7); // 很快閃到定位、稍停、再收回
    const ix = d * 0.8 * e, lean = d * 0.035 * e;
    if (d < 0) { aL = 0.1 * e; aR = -0.06 * e; } else { aL = -0.06 * e; aR = 0.1 * e; } // 手臂角度微調（長度不變）
    aL *= k; aR *= k;
    ctx.translate(ix * k, 0);
    ctx.translate(0, 18); ctx.rotate(lean * k); ctx.translate(0, -18);
  }
  if (pose === 0) { ctx.translate(0, 18); ctx.rotate(0.2); ctx.translate(0, -18); }    // 歪著身體耍帥
  if (pose === 2) { ctx.translate(0, 18); ctx.rotate(-0.16); ctx.translate(0, -18); }
  if (sq > 0) { // 地上的壓痕
    ctx.fillStyle = `rgba(30,16,6,${0.3 * sq})`;
    ctx.beginPath(); ctx.ellipse(0, 17, 20 * sq + 8, 5 * sq + 1, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const limbsPath = () => {
  ctx.beginPath();
  ctx.moveTo(X(0), Y(-1)); ctx.lineTo(X(0), Y(8));
  let lx = -leg - swing, rx = leg + swing;
  if (pose === -1) {
    // 八字形：雙手從肩膀往兩側斜下垂放（走路時前後擺動）
    const aLen = Math.hypot(arm, 8), aTh = Math.atan2(arm, 8); // 兩隻手臂永遠一樣長，只轉角度
    const thL = aTh - swing * 0.09 + aL, thR = aTh + swing * 0.09 + aR;
    ctx.moveTo(X(0), Y(1)); ctx.lineTo(X(-aLen * Math.sin(thL)), Y(1 + aLen * Math.cos(thL)));
    ctx.moveTo(X(0), Y(1)); ctx.lineTo(X(aLen * Math.sin(thR)), Y(1 + aLen * Math.cos(thR)));
  } else if (pose === 0) { // 迪斯可：一手斜指天空，另一手斜指地面
    ctx.moveTo(X(0), Y(1)); ctx.lineTo(X(14), Y(-19));
    ctx.moveTo(X(0), Y(1)); ctx.lineTo(X(-10), Y(12));
  } else if (pose === 1) { // 秀肌肉：雙手彎起握拳
    ctx.moveTo(X(0), Y(1)); ctx.lineTo(X(-14.5), Y(1)); ctx.lineTo(X(-14.5), Y(-9));
    ctx.moveTo(X(0), Y(1)); ctx.lineTo(X(14.5), Y(1)); ctx.lineTo(X(14.5), Y(-9));
  } else { // 金雞獨立：雙手平舉像飛機
    ctx.moveTo(X(0), Y(1)); ctx.lineTo(X(-15), Y(-3));
    ctx.moveTo(X(0), Y(1)); ctx.lineTo(X(15), Y(-3));
  }
  if (pose === 0) { // 迪斯可：雙腳張開，一腳膝蓋彎起
    ctx.moveTo(X(0), Y(8)); ctx.lineTo(X(-5), Y(13)); ctx.lineTo(X(-8), Y(18));
    ctx.moveTo(X(0), Y(8)); ctx.lineTo(X(6), Y(12)); ctx.lineTo(X(6), Y(18));
  } else if (pose === 1) { // 馬步
    ctx.moveTo(X(0), Y(8)); ctx.lineTo(X(-7), Y(12)); ctx.lineTo(X(-8), Y(18));
    ctx.moveTo(X(0), Y(8)); ctx.lineTo(X(7), Y(12)); ctx.lineTo(X(8), Y(18));
  } else if (pose === 2) { // 金雞獨立：膝蓋抬高
    ctx.moveTo(X(0), Y(8)); ctx.lineTo(X(-2), Y(18));
    ctx.moveTo(X(0), Y(8)); ctx.lineTo(X(8), Y(6)); ctx.lineTo(X(6), Y(13));
  } else {
    ctx.moveTo(X(0), Y(8)); ctx.lineTo(X(lx), Y(18));
    ctx.moveTo(X(0), Y(8)); ctx.lineTo(X(rx), Y(18));
  }
  };
  const headPath = () => { ctx.beginPath(); ctx.ellipse(X(0), Y(-12), 11 * sx, 11 * sy, 0, 0, Math.PI * 2); };

  // 腳下的陰影：只在腳底正下方
  const gs = ctx.createRadialGradient(0, 18.5, 1, 0, 18.5, 10);
  gs.addColorStop(0, 'rgba(15,6,0,0.42)'); gs.addColorStop(1, 'rgba(15,6,0,0)');
  ctx.fillStyle = gs;
  ctx.beginPath(); ctx.ellipse(0, 18.5, 10 * sx, 3.2 * sy + 0.8, 0, 0, Math.PI * 2); ctx.fill();

  // 身體：黑色細線條；頭：純白填滿、黑色描邊
  limbsPath(); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.2; ctx.stroke();
  headPath(); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = 2.2; ctx.strokeStyle = '#111'; ctx.stroke();
  if (pose >= 0) drawPoseExtras(pose, X, Y);
  ctx.restore();
}
// pose 專用的道具：秀肌肉時雙手握拳
function drawPoseExtras(pose, X, Y) {
  if (pose !== 1) return;
  ctx.fillStyle = '#111';
  for (const sx of [-14.5, 14.5]) { ctx.beginPath(); ctx.arc(X(sx), Y(-9), 2.2, 0, Math.PI * 2); ctx.fill(); }
}
// 被石頭撞到後，人物隨著石頭滾過去的位置被壓扁
function updateSquash() {
  const h = player.hit;
  if (!isGameOver || !h) return;
  const along = (h.horizontal ? h.x - player.px : h.y - player.py) * h.dir; // 負 = 石頭還沒到，正 = 已經滾過
  const t = Math.min(1, Math.max(0, (along + h.r * 0.9) / (h.r * 1.2)));
  player.sq = Math.max(player.sq || 0, t);
  if (!player.puffed && player.sq > 0.5) {
    player.puffed = true;
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, sp = Math.random() * 1.8 + 0.4;
      particles.push({ x: player.px + Math.cos(a) * cell * 0.15, y: player.py + cell * 0.2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5 - 0.2, size: Math.random() * 6 + 3, life: 0.9, dust: true });
    }
  }
}

// 方格外的箭頭提示：出現在石頭進場的那一側
function drawArrow(h) {
  let ax, ay, ang;
  if (h.horizontal) {
    ax = h.dir > 0 ? -pad / 2 : size + pad / 2;
    ay = (h.idx + 0.5) * cell;
    ang = h.dir > 0 ? 0 : Math.PI;
  } else {
    ax = (h.idx + 0.5) * cell;
    ay = h.dir > 0 ? -pad / 2 : size + pad / 2;
    ang = h.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
  }
  const L = pad * 0.98;
  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(ang);
  ctx.fillStyle = '#ff3b30';
  ctx.beginPath();
  // 有尾巴的箭頭：細長的箭桿 + 三角形箭頭
  const w = L * 0.25, hh = L * 0.5, hx = L * 0.02; // 箭桿半寬、箭頭半寬、箭頭起點
  ctx.moveTo(-L / 2, -w);
  ctx.lineTo(hx, -w);
  ctx.lineTo(hx, -hh);
  ctx.lineTo(L / 2, 0);
  ctx.lineTo(hx, hh);
  ctx.lineTo(hx, w);
  ctx.lineTo(-L / 2, w);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.stroke();
  ctx.restore();
}

// 石頭：不規則多邊形，邊移動邊滾動
function drawRock(h) {
  const n = h.shape.length;
  // 地面陰影
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath();
  if (h.horizontal) ctx.ellipse(h.x, h.y + h.r * 0.95, h.r * 0.9, h.r * 0.22, 0, 0, Math.PI * 2);
  else ctx.ellipse(h.x + h.r * 0.95, h.y, h.r * 0.22, h.r * 0.9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.rotate(h.rot);
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const rr = h.r * h.shape[i];
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = '#8d8d8d';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#4a4a4a';
  ctx.stroke();
  // 裂紋（跟著石頭旋轉）
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(40,40,40,0.55)';
  ctx.beginPath();
  ctx.moveTo(-h.r * 0.1, -h.r * 0.55); ctx.lineTo(h.r * 0.12, -h.r * 0.1); ctx.lineTo(-h.r * 0.2, h.r * 0.25); ctx.lineTo(-h.r * 0.05, h.r * 0.6);
  ctx.moveTo(h.r * 0.12, -h.r * 0.1); ctx.lineTo(h.r * 0.5, h.r * 0.05);
  ctx.stroke();
  // 光源固定在左上，不隨石頭旋轉
  ctx.rotate(-h.rot);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(-h.r * 0.3, -h.r * 0.35, h.r * 0.24, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.arc(h.r * 0.25, h.r * 0.3, h.r * 0.38, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// 立體滾動的石頭：輪廓不轉，表面的斑塊沿行進方向滾過去
// （滾動角度 = 位移 / 半徑），越到邊緣越扁、轉到背面就消失，橫向與直向都一樣
function drawRockRolling(h) {
  const zr = h.z / ZDROP, lift = 1 + 0.9 * zr; // 位置越高，石頭看起來越大、陰影離得越遠
  const R = h.r * (1 + 0.12 * zr), n = h.shape.length;
  const trace = () => {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, rr = R * h.shape[i];
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  };
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(h.x + R * 0.2 * lift, h.y + R * 0.3 * lift, R * 1.0, R * 0.9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(h.x, h.y - h.z * 0.6); // 在空中時，石頭本體往上偏，陰影留在地面
  trace();
  const g = ctx.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.1, 0, 0, R * 1.1);
  g.addColorStop(0, '#b9b6af'); g.addColorStop(0.6, '#8a8782'); g.addColorStop(1, '#5a5753');
  ctx.fillStyle = g; ctx.fill();
  ctx.save();
  ctx.clip();
  for (const s of h.spots) {
    const a = s.phi + h.roll, c = Math.cos(a);
    if (c <= 0.05) continue;
    const u = Math.sin(a) * R * 0.95 * Math.sqrt(1 - s.lat * s.lat), w = s.lat * R * 0.95;
    const sz = s.size * R * 1.8;
    const rx = h.horizontal ? sz * c : sz, ry = h.horizontal ? sz : sz * c;
    ctx.fillStyle = `rgba(45,42,40,${0.6 * c})`;
    ctx.beginPath(); ctx.ellipse(h.horizontal ? u : w, h.horizontal ? w : u, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(210,206,198,${0.22 * c})`;
    ctx.beginPath(); ctx.ellipse((h.horizontal ? u : w) - 2, (h.horizontal ? w : u) - 2, rx * 0.5, ry * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  }
  // 更細的顆粒（深色小坑洞與淺色礦物點）
  for (const q of h.specks) {
    const a = q.phi + h.roll, c = Math.cos(a);
    if (c <= 0.05) continue;
    const u = Math.sin(a) * R * 0.95 * Math.sqrt(1 - q.lat * q.lat), w = q.lat * R * 0.95, sz = q.size * R * 1.8;
    const px = h.horizontal ? u : w, py = h.horizontal ? w : u;
    ctx.fillStyle = q.light ? `rgba(225,222,214,${0.5 * c})` : `rgba(35,32,30,${0.7 * c})`;
    ctx.beginPath(); ctx.ellipse(px, py, h.horizontal ? sz * c : sz, h.horizontal ? sz : sz * c, 0, 0, Math.PI * 2); ctx.fill();
  }
  // 裂紋（跟著石頭一起滾動）
  ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  for (const k of h.cracks) {
    const a1 = k.phi + h.roll, a2 = a1 + k.dphi, c1 = Math.cos(a1), c2 = Math.cos(a2);
    if (c1 <= 0.1 || c2 <= 0.1) continue;
    const l2 = Math.max(-0.95, Math.min(0.95, k.lat + k.dlat));
    const u1 = Math.sin(a1) * R * 0.95 * Math.sqrt(1 - k.lat * k.lat), w1 = k.lat * R * 0.95;
    const u2 = Math.sin(a2) * R * 0.95 * Math.sqrt(1 - l2 * l2), w2 = l2 * R * 0.95;
    ctx.strokeStyle = `rgba(30,28,26,${0.6 * Math.min(c1, c2)})`;
    ctx.beginPath();
    ctx.moveTo(h.horizontal ? u1 : w1, h.horizontal ? w1 : u1);
    ctx.lineTo(h.horizontal ? u2 : w2, h.horizontal ? w2 : u2);
    ctx.stroke();
  }
  ctx.restore();
  trace();
  ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.strokeStyle = '#45423e'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.arc(-R * 0.3, -R * 0.38, R * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

let lastT = performance.now();
let fpsFrames = 0, fpsLast = performance.now();
const fpsEl = document.getElementById('fps');
function loop() {
  // 用實際經過的時間換算，不管螢幕更新率多少，石頭的滾動速度都一樣
  const nowT = performance.now();
  const dt = Math.min(3, (nowT - lastT) / (1000 / 60));
  lastT = nowT;
  fpsFrames++;
  if (nowT - fpsLast >= 500) {
    fpsEl.innerText = Math.round((fpsFrames * 1000) / (nowT - fpsLast)) + ' FPS';
    fpsFrames = 0; fpsLast = nowT;
  }
  if (inMenu || paused) { requestAnimationFrame(loop); return; }
  ctx.save();
  if (shakeTime > 0) {
    ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
    shakeTime--;
  }
  ctx.translate(pad, pad);
  ctx.clearRect(-pad - 20, -pad - 20, size + 2 * pad + 40, size + 2 * pad + 40);
  ctx.drawImage(bg2, -pad, -pad);
  drawGrid();

  if (!isGameOver) {
    const elapsed = ((Date.now() - startTime) / 1000);
    ui.innerText = elapsed.toFixed(2) + ' 秒';

    spawnTimer += dt;
    if (spawnTimer >= nextWave) { spawnWave(elapsed); spawnTimer = 0; nextWave = waveInterval(elapsed) * (0.6 + Math.random() * 0.8); }

    // 平滑移動到目標格
    const tx = (player.c + 0.5) * cell, ty = (player.r + 0.5) * cell;
    const lerp = Math.min(1, 0.35 * dt);
    player.px += (tx - player.px) * lerp;
    player.py += (ty - player.py) * lerp;
  }

  // 玩家（被撞到後，石頭會從身上碾過去，人物被壓扁留在地上；石頭畫在人物上面）
  updateSquash();
  drawStickman(player, player.sq || 0);

  for (let i = hazards.length - 1; i >= 0; i--) {
    const h = hazards[i];
    if (h.warn > 0) {
      h.warn -= dt;
      if (Math.floor(h.warn / 5) % 2 === 0) drawArrow(h);
    } else {
      h.v = h.dir * cell * 0.05; // 滾動速度固定：每秒 3 格，過邊緣也不變
      if (h.horizontal) h.x += h.v * dt; else h.y += h.v * dt;
      updateFall(h, dt);
      h.roll += (h.v / h.r) * dt; // 轉動角度 = 位移 / 半徑，才像真的在滾
      if (Math.random() < 0.6) {
        const bx = h.horizontal ? h.x - Math.sign(h.v) * h.r * 0.8 : h.x + (Math.random() - 0.5) * h.r;
        const by = h.horizontal ? h.y + h.r * 0.8 : h.y - Math.sign(h.v) * h.r * 0.8;
        particles.push({ x: bx, y: by, vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.7) * 0.8, size: Math.random() * 5 + 3, life: 0.6, dust: true });
      }
      drawRockRolling(h);

      if (!isGameOver && Math.hypot(player.px - h.x, player.py - h.y) < cell * 0.2 + h.r && h.z < ZDROP * 0.45) {
        isGameOver = true;
        shakeTime = 6;
        player.hit = h; player.sq = 0;
        sfxDie();
        const secs = parseFloat(ui.innerText);
        const isNew = secs > best;
        if (isNew) { best = secs; try { localStorage.setItem('mrOopsBest', String(best)); } catch (e) {} showBest(); saveBestRemote(); }
        finalScore.innerText = `你撐了 ${ui.innerText}` + (isNew ? '（新紀錄！）' : '');
        setTimeout(() => { if (isGameOver) gameoverScreen.style.display = 'flex'; }, 1000);
      }
      if (h.x < -cell * 2 || h.x > size + cell * 2 || h.y < -cell * 2 || h.y > size + cell * 2) hazards.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; if (!pt.dust) pt.vy += 0.3;
    pt.life -= pt.dust ? 0.03 : 0.02;
    ctx.fillStyle = pt.dust ? `rgba(150, 140, 130, ${Math.max(pt.life, 0) * 0.6})` : `rgba(34, 34, 34, ${Math.max(pt.life, 0)})`;
    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
    if (pt.life <= 0) particles.splice(i, 1);
  }

  updateRollSound();
  ctx.restore();
  requestAnimationFrame(loop);
}

// ===== 主頁、暫停、聲音 =====
let inMenu = true, paused = false, pauseAt = 0;
const $ = id => document.getElementById(id);
const menuEl = $('menu'), pauseMenu = $('pausemenu'), pauseBtn = $('pause');
function setUI(on) { document.documentElement.classList.toggle('ui', on); }

// --- 聲音（全部用 WebAudio 合成，不需要音檔）---
let musicVol = 0.5, sfxVol = 0.7;
try {
  const v = JSON.parse(localStorage.getItem('mrOopsVol') || 'null');
  if (v) { musicVol = v.m; sfxVol = v.s; }
} catch (e) {}
let actx = null, musicGain, sfxGain, noiseGain, noiseBuf, musicTimer = null;
function applyVol() {
  if (musicGain) musicGain.gain.value = musicVol;
  if (sfxGain) sfxGain.gain.value = sfxVol;
  $('vol-music').value = Math.round(musicVol * 100); $('vm').innerText = Math.round(musicVol * 100);
  $('vol-sfx').value = Math.round(sfxVol * 100); $('vs').innerText = Math.round(sfxVol * 100);
}
function saveVol() { try { localStorage.setItem('mrOopsVol', JSON.stringify({ m: musicVol, s: sfxVol })); } catch (e) {} }

function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  musicGain = actx.createGain(); sfxGain = actx.createGain();
  // 柔和限幅器：音量小時完全不改變聲音，只在過大時圓滑地削峰，避免爆音（不會像壓縮器那樣把整體音量拉高）
  const lim = actx.createWaveShaper(), cv = new Float32Array(2049);
  for (let i = 0; i < cv.length; i++) { const x = i / 1024 - 1, a = Math.abs(x); cv[i] = Math.sign(x) * (a < 0.6 ? a : 0.6 + 0.4 * Math.tanh((a - 0.6) / 0.4)); }
  lim.curve = cv; lim.connect(actx.destination);
  musicGain.connect(lim); sfxGain.connect(lim);
  applyVol();
  // 石頭滾動：低頻噪音 + 緩慢起伏，音量依場上滾動中的石頭數量變化
  const len = actx.sampleRate * 2;
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
  makeVoices();
  startMusic();
}

const midi = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(freq, t, dur, type, vol, dest) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.05);
}
const PROG = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59]];
const ARP = [0, 1, 2, 1, 2, 1, 2, 1];
const PENT = [69, 72, 74, 76, 79, 81];
let mStep = 0, mNext = 0;
function scheduleMusic() {
  if (!actx || actx.state !== 'running') return;
  const sd = 60 / 124 / 2;
  if (mNext < actx.currentTime) mNext = actx.currentTime + 0.05;
  while (mNext < actx.currentTime + 0.6) {
    const chord = PROG[Math.floor(mStep / 8) % 4], s = mStep % 8;
    tone(midi(chord[ARP[s]] + 12), mNext, sd * 0.9, 'triangle', 0.13, musicGain);
    if (s % 4 === 0) tone(midi(chord[0] - 24), mNext, sd * 3.6, 'triangle', 0.22, musicGain);
    if (s % 2 === 1 && Math.random() < 0.35) tone(midi(PENT[Math.floor(Math.random() * PENT.length)]), mNext, sd * 1.4, 'square', 0.05, musicGain);
    mStep++; mNext += sd;
  }
}
function startMusic() { if (!musicTimer) musicTimer = setInterval(scheduleMusic, 150); }

// 粉紅噪音（比白噪音柔和、比棕噪音在手機喇叭上聽得到）
function makePink(sec = 2) {
  const len = Math.floor(actx.sampleRate * sec);
  const buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
    b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
    b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
    d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
    b6 = w * 0.115926;
  }
  return buf;
}
let whooshBuf = null;
// 移動音效：揮動手臂的「咻」——寬頻氣流聲，中頻先升後降，再疊一層高頻氣音
function sfxMove() {
  if (!actx) return;
  if (!whooshBuf) whooshBuf = makePink(0.6);
  const t = actx.currentTime;
  const layer = (type, f0, f1, f2, q, peak, tPeak, tEnd) => {
    const src = actx.createBufferSource(); src.buffer = whooshBuf;
    const f = actx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(f1, t + tPeak);
    f.frequency.exponentialRampToValueAtTime(f2, t + tEnd);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + tPeak);
    g.gain.exponentialRampToValueAtTime(0.0001, t + tEnd);
    src.connect(f); f.connect(g); g.connect(sfxGain);
    src.start(t, Math.random() * 0.2, tEnd + 0.05);
  };
  layer('bandpass', 450, 1500, 650, 0.8, 0.5, 0.1, 0.28);
  layer('bandpass', 3200, 4800, 2600, 0.6, 0.14, 0.09, 0.22);
}
function sfxDie() {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.35);
  g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + 0.45);
  const n = actx.createBufferSource(), ng = actx.createGain();
  n.buffer = noiseBuf;
  ng.gain.setValueAtTime(0.9, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  n.connect(ng); ng.connect(sfxGain); n.start(t, 0, 0.35);
}
// 石頭滾動：每顆在地面滾動的石頭各用一條獨立的低頻噪音（音色、起伏速度都不同）。
// 音量固定（每條 = 總音量 / √條數），石頭越多只是聲音層次越豐富；
// 石頭在空中下墜時沒有接觸地面，滾動聲會暫時消失，著地後再接上。
const MAX_VOICES = 8, ROLL_LEVEL = 0.85;
const voices = [];
function makeVoices() {
  const pinkBuf = makePink();
  for (let i = 0; i < MAX_VOICES; i++) {
    const src = actx.createBufferSource(); src.buffer = pinkBuf; src.loop = true;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380 + Math.random() * 320;
    const mod = actx.createGain(); mod.gain.value = 0.75;
    const lfo = actx.createOscillator(); lfo.frequency.value = 4 + Math.random() * 5;
    const lfoG = actx.createGain(); lfoG.gain.value = 0.25;
    lfo.connect(lfoG); lfoG.connect(mod.gain);
    const g = actx.createGain(); g.gain.value = 0;
    src.connect(lp); lp.connect(mod); mod.connect(g); g.connect(sfxGain);
    src.start(0, Math.random() * 1.8); lfo.start();
    voices.push({ g });
  }
}
function setRoll(v) { if (!actx) return; voices.forEach(o => o.g.gain.setTargetAtTime(v, actx.currentTime, 0.08)); }
// 大石頭砸在泥土地上：低頻重擊 + 泥土被壓開的悶響 + 碎土顆粒
let duckUntil = 0; // 著地的瞬間把滾動聲壓低一下，讓著地聲突出
function sfxLand(vol = 1) {
  if (!actx) return;
  const t = actx.currentTime;
  duckUntil = t + 0.4;
  const out = actx.createGain(); out.gain.value = vol; out.connect(sfxGain);
  if (!whooshBuf) whooshBuf = makePink(0.6);
  const burst = (buf, type, freq, q, peak, dur, off) => {
    const n = actx.createBufferSource(); n.buffer = buf;
    const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = actx.createGain();
    g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f); f.connect(g); g.connect(out); n.start(t, off, dur + 0.05);
  };
  // 1) 重擊的低頻（起點拉高到 200Hz，手機喇叭也聽得到）
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.4);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.45);
  // 2) 撞擊瞬間的中頻「砰」（這是最容易被聽見的部分）
  burst(whooshBuf, 'lowpass', 300, 0.7, 1.0, 0.18, Math.random() * 0.3);
  // 3) 泥土被壓開的悶響
  burst(noiseBuf, 'lowpass', 400, 0.7, 1.7, 0.45, Math.random() * 1.5);
  // 4) 碎土顆粒
  burst(whooshBuf, 'lowpass', 700, 0.7, 0.2, 0.22, Math.random() * 0.3);
}
function updateRollSound() {
  if (!actx || !voices.length) return;
  const now = actx.currentTime;
  let n = 0;
  if (!isGameOver) {
    for (const h of hazards) {
      if (h.warn <= 0 && !h.air && h.x > -cell && h.x < size + cell && h.y > -cell && h.y < size + cell) n++;
    }
  }
  n = Math.min(n, MAX_VOICES);
  const per = n ? (ROLL_LEVEL / Math.sqrt(n)) * (now < duckUntil ? 0.3 : 1) : 0;
  voices.forEach((o, i) => o.g.gain.setTargetAtTime(i < n ? per : 0, now, 0.08));
}

// --- 暫停 ---
function pauseGame() {
  if (inMenu || paused || isGameOver) return;
  paused = true; pauseAt = Date.now();
  setRoll(0);
  pauseMenu.classList.remove('hidden');
  setUI(true);
}
function resumeGame() {
  if (!paused) return;
  paused = false;
  startTime += Date.now() - pauseAt;
  lastT = performance.now();
  pauseMenu.classList.add('hidden');
  setUI(false);
}
function goHome() {
  paused = false; inMenu = true;
  setRoll(0);
  gameoverScreen.style.display = 'none';
  pauseMenu.classList.add('hidden');
  menuEl.classList.remove('hidden');
  pauseBtn.style.display = 'none';
  setUI(true);
}

$('btn-start').addEventListener('click', () => {
  ensureAudio();
  menuEl.classList.add('hidden');
  inMenu = false; paused = false;
  pauseBtn.style.display = 'flex';
  setUI(false);
  init();
  lastT = performance.now();
});
$('home').addEventListener('click', goHome);
$('btn-pause-home').addEventListener('click', goHome);
$('btn-resume').addEventListener('click', resumeGame);
pauseBtn.addEventListener('click', pauseGame);
$('vol-music').addEventListener('input', e => { musicVol = e.target.value / 100; applyVol(); saveVol(); });
$('vol-sfx').addEventListener('input', e => { sfxVol = e.target.value / 100; applyVol(); saveVol(); });
$('vol-sfx').addEventListener('change', sfxMove);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pauseGame(); if (actx && actx.state === 'running') actx.suspend(); }
  else if (actx) actx.resume();
});
window.addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'p') { paused ? resumeGame() : pauseGame(); } });
applyVol();

init();
loop();
</script>
